# Lint config for the FastAPI RAG backend.
# CI and local development use the version pinned in requirements-dev.txt.
# CI enforces both lint and formatting.

target-version = "py311"

[lint]
# Keep the established correctness rules explicit across tool upgrades.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# E402: imports deliberately placed after runtime setup (sys.path tweaks,
# load_dotenv, or a module-level helper defined before the import block).
"app/main.py" = ["E402"]
"app/services/kb_service.py" = ["E402"]
"scripts/print_embedding_dim.py" = ["E402"]
"tests/conftest.py" = ["E402"]
