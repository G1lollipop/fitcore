  - id: issn_meal_frequency
    title: "ISSN Position Stand: Meal Frequency"
    url: https://jissn.biomedcentral.com/articles/10.1186/1550-2783-8-4
    type: html
    license: CC BY 4.0
    tags: [meal frequency, eating frequency, metabolism, body composition, nutrition]
    fetch: true

  - id: rest_interval_hypertrophy
    title: "Give It a Rest: Inter-Set Rest Interval Duration and Muscle Hypertrophy (Frontiers, 2024)"
    url: https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2024.1429789/full
    type: html
    license: CC BY 4.0
    tags: [rest interval, recovery, hypertrophy, volume load, resistance training]
    fetch: true

  # ── Manually fetched via mirror / WebFetch (script scraper blocked) ──────
  # These two articles' publishing sites block fetch_sources.py's scraping (PMC/MDPI
  # anti-scraping), but the content is CC BY and has been obtained via mirror/WebFetch
  # and written to data/<curated_file>. fetch: false makes the script skip them (to avoid
  # a guaranteed failure); ingest_seed_kb.py still ingests them normally via auto_*.txt.
  - id: issn_energy_drinks
    title: "ISSN Position Stand: Energy Drinks and Energy Shots (Jagim et al., 2023)"
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9987737/
    type: html
    license: CC BY 4.0
    tags: [energy drinks, energy shots, caffeine, taurine, ergogenic aid, performance]
    fetch: false
    curated_file: auto_issn_energy_drinks.txt

  - id: hydration_beverages
    title: "Compositional Aspects of Beverages Designed to Promote Hydration Before/During/After Exercise (Nutrients, 2024)"
    url: https://www.mdpi.com/2072-6643/16/1/17
    type: html
    license: CC BY 4.0
    tags: [hydration, fluid, electrolytes, sodium, carbohydrate-electrolyte, rehydration, sweat]
    fetch: false
    curated_file: auto_hydration_beverages.txt

  # Wanted but excluded — host blocks automated fetch (Cloudflare / publisher
  # anti-scraping) despite the articles being CC-BY:
  #   - The Sleep and Recovery Practices of Athletes (MDPI Nutrients) → 403
  #   - ISSN Nutritional Concerns of the Female Athlete (Taylor & Francis) → blocked
  # Revisit if a license-clean institutional-repository mirror is found.

  # ── Bulk-harvested CC-BY open-access set (auto_epmc_*.txt) ───────────────
  # ~1050 CC-BY open-access full texts, discovered by scripts/harvest_kb.py via Europe PMC
  # and with bodies fetched through the PMC BioC full-text API (bypassing MDPI/PMC
  # anti-scraping, covering the entire PMC open-access subset), spanning 170+ topics such as
  # training programming, technique/biomechanics, injury rehab, recovery, supplements,
  # nutrition, cardio, special populations, muscle physiology, and health outcomes, expanding
  # the KB to 1000+ documents. Per-document provenance (title/URL/license/tags) is in
  # data/harvested_sources.json, and each file's header carries the same information.
  # Note: auto_epmc_*.txt files are large, already ignored by the root .gitignore, and not
  # committed to version control (they can be reproduced by the script).
  # Re-run (idempotent, deduplicates by PMCIDs already on disk, only topping up to --target):
  #   ./.venv/Scripts/python scripts/harvest_kb.py --target 90
  # These files are not listed individually in this manifest (it would make sources.yaml too
  # long); ingest_seed_kb.py ingests them as usual via the data/auto_*.txt glob.
