# Knowledge-base source registry (authoritative, license-clean English sources).
#
# How this is used:
#   - `curated: true`  → a hand-written, verified summary already lives in
#       data/<curated_file>. scripts/fetch_sources.py SKIPS these (no dup).
#   - `fetch: true`    → scripts/fetch_sources.py downloads the URL, extracts
#       clean text (HTML via trafilatura, PDF via pypdf) and writes
#       data/auto_<id>.txt with a provenance header. These then get embedded by
#       scripts/ingest_seed_kb.py like any other data/*.txt file.
#
# Only add sources that are freely licensed (CC-BY / public domain / official
# guidelines). Do NOT add paywalled/copyrighted content (Examine, MASS, etc.).

sources:
  # ── ISSN position stands (full text fetched from JISSN/BMC, CC BY) ───────
  # Previously hand-written curated summaries (kb_01~05); replaced with full-text BMC
  # fetches, with ids corresponding to data/auto_<id>.txt. The BMC HTML mirror can be
  # extracted normally by fetch_sources.py's browser UA (PMC/Springer mirrors block crawlers).
  - id: issn_protein
    title: "ISSN Position Stand: Protein and Exercise (Jäger et al., 2017)"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0177-8
    type: html
    license: CC BY 4.0
    tags: [protein, hypertrophy, fat loss, recovery, muscle protein synthesis]
    fetch: true

  - id: issn_creatine
    title: "ISSN Position Stand: Safety and Efficacy of Creatine Supplementation (Kreider et al., 2017)"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0173-z
    type: html
    license: CC BY 4.0
    tags: [creatine, supplements, strength, power, lean mass, loading, safety]
    fetch: true

  - id: issn_nutrient_timing
    title: "ISSN Position Stand: Nutrient Timing (Kerksick et al., 2017)"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0189-4
    type: html
    license: CC BY 4.0
    tags: [nutrient timing, carbohydrate, protein, glycogen, recovery]
    fetch: true

  - id: issn_caffeine
    title: "ISSN Position Stand: Caffeine and Exercise Performance (Guest et al., 2021)"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-020-00383-4
    type: html
    license: CC BY 4.0
    tags: [caffeine, ergogenic aid, endurance, strength, dosing]
    fetch: true

  - id: issn_diets
    title: "ISSN Position Stand: Diets and Body Composition (Aragon et al., 2017)"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0174-y
    type: html
    license: CC BY 4.0
    tags: [fat loss, muscle gain, calorie balance, diet types, adherence]
    fetch: true

  # ── Auto-fetched sources (fetch_sources.py downloads + extracts) ─────────
  # Toggle `fetch: true` and run scripts/fetch_sources.py to pull these.
  - id: issn_review_2018
    title: "ISSN Exercise & Sports Nutrition Review Update: Research & Recommendations"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-018-0242-y
    type: html
    license: CC BY 4.0
    tags: [nutrition, supplements, macronutrients, hydration]
    # Intentionally not ingested: this is a "big review" covering protein/creatine/caffeine
    # etc., which overlaps heavily with the topic-specific KBs; ingesting it would compete
    # for hits with the specific position stands and lower the nDCG of the qrels evaluation.
    fetch: false

  - id: who_physical_activity_2020
    title: "WHO Guidelines on Physical Activity and Sedentary Behaviour (2020)"
    url: https://iris.who.int/bitstream/handle/10665/336656/9789240015128-eng.pdf
    type: pdf
    license: CC BY-NC-SA 3.0 IGO
    tags: [physical activity, public health, exercise guidelines]
    fetch: true

  - id: dietary_guidelines_2020_2025
    title: "Dietary Guidelines for Americans, 2020-2025"
    url: https://www.dietaryguidelines.gov/sites/default/files/2020-12/Dietary_Guidelines_for_Americans_2020-2025.pdf
    type: pdf
    license: Public Domain (US Government work)
    tags: [diet, nutrition, public health, food groups]
    fetch: true

  # ── Resistance-training programming / technique sources (CC-BY only) ──────
  # Added to broaden KB beyond nutrition so retrieval eval (Recall/nDCG) has
  # real coverage for training-volume / frequency / periodization / concurrent
  # / warm-up questions. All verified CC-BY (no NonCommercial/NoDerivs).
  - id: rt_hypertrophy_umbrella
    title: "Resistance Training Variables for Optimization of Muscle Hypertrophy: An Umbrella Review"
    # Frontiers original full text (the PMC mirror blocks crawlers; trafilatura can't extract the body).
    url: https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2022.949021/full
    type: html
    license: CC BY 4.0
    tags: [resistance training, volume, frequency, hypertrophy, periodization, progressive overload]
    fetch: true

  - id: periodized_rt_minireview
    title: "Periodized Resistance Training for Enhancing Skeletal Muscle Hypertrophy and Strength: A Mini-Review"
    url: https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2019.00013/full
    type: html
    license: CC BY 4.0
    tags: [periodization, progressive overload, strength, hypertrophy, programming]
    fetch: true

  - id: concurrent_training_review
    title: "Compatibility of Concurrent Aerobic and Strength Training for Skeletal Muscle Size and Function: An Updated Systematic Review and Meta-Analysis (Schumann et al., 2021)"
    # The MDPI original blocks crawlers; use a real direct-link PDF from an institutional repository (Sports Medicine, CC BY 4.0).
    url: https://researchonline.jcu.edu.au/71546/1/Schumann2021_Article_CompatibilityOfConcurrentAerob.pdf
    type: pdf
    license: CC BY 4.0
    tags: [concurrent training, interference effect, cardio, strength, hypertrophy]
    fetch: true

  - id: warmup_resistance_training
    title: "Warm-up and Re-warm-up Insights into Resistance Training"
    url: https://opensportssciencesjournal.com/VOLUME/18/ELOCATOR/e1875399X429130/FULLTEXT/
    type: html
    license: CC BY 4.0
    tags: [warm-up, mobility, injury prevention, resistance training]
    fetch: true

  # ── Ergogenic-aid / supplement position stands (ISSN, CC-BY) ─────────────
  # Broaden KB supplement coverage beyond protein/creatine/caffeine so the
  # retrieval eval has in-scope coverage for buffering agents and HMB. All are
  # open-access ISSN position stands under CC BY 4.0.
  - id: issn_beta_alanine
    title: "ISSN Position Stand: Beta-Alanine"
    # BMC publisher full-text HTML (the Springer mirror blocks crawlers; trafilatura extracts 0 characters).
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-015-0090-y
    type: html
    license: CC BY 4.0
    tags: [beta-alanine, carnosine, buffering, high-intensity, endurance]
    fetch: true

  - id: issn_sodium_bicarbonate
    title: "ISSN Position Stand: Sodium Bicarbonate and Exercise Performance"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-021-00458-w
    type: html
    license: CC BY 4.0
    tags: [sodium bicarbonate, buffering, blood pH, high-intensity, ergogenic aid]
    fetch: true

  - id: issn_hmb
    title: "ISSN Position Stand: beta-Hydroxy-beta-Methylbutyrate (HMB)"
    # The Taylor & Francis original blocks crawlers; use the CC BY full-text PDF from the Lindenwood institutional repository.
    url: https://digitalcommons.lindenwood.edu/cgi/viewcontent.cgi?article=1713&context=faculty-research-papers
    type: pdf
    license: CC BY 4.0
    tags: [HMB, leucine, muscle protein synthesis, recovery, supplement]
    fetch: true

  # ── Recovery / gut / female-athlete topics (CC-BY) ───────────────────────
  # Broaden beyond nutrition+supplements into recovery, gut health, and
  # sex-specific nutrition so retrieval eval covers more of what users ask.
  - id: issn_probiotics
    title: "ISSN Position Stand: Probiotics"
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-019-0329-0
    type: html
    license: CC BY 4.0
    tags: [probiotics, gut health, immunity, recovery, supplement]
