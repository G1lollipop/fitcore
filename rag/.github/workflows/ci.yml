name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: FastAPI / Python 3.11
  #
  # Frontend CI lives in the fitcore-web repo (separate git repo). When that's
  # set up, mirror this layout there with `npm ci && lint && typecheck && build`.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (ruff · pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-prod.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        env:
          # Tests should not hit external APIs. If any test reaches for these
          # vars, set them as repo secrets and reference them here.
          GOOGLE_AI_STUDIO_API_KEY: ci-dummy
          SUPABASE_URL: https://ci-dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy
          VECTOR_BACKEND: chroma
          RERANKER_ENABLED: 'false'
          CACHE_BACKEND: memory
        run: pytest
