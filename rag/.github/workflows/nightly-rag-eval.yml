name: Nightly RAG Eval

# Why nightly + manual only:
#   - Eval calls Gemini for both retrieval AND LLM-as-Judge — every run
#     consumes free-tier quota. Per-PR is too expensive and too noisy.
#   - Retrieval quality regressions are usually caused by data, prompt, or
#     model drift, not individual code changes — a daily snapshot is the right
#     cadence to catch them.
on:
  schedule:
    # 04:00 UTC daily. Adjust if you need a different window.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      relevance_threshold:
        description: 'Min average relevance (0-1)'
        default: '0.95'
      completeness_threshold:
        description: 'Min average completeness (0-1)'
        default: '0.80'
      accuracy_threshold:
        description: 'Min average accuracy (0-1)'
        default: '0.95'

concurrency:
  group: nightly-rag-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Run RAG eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEVANCE_THRESHOLD: ${{ inputs.relevance_threshold || '0.95' }}
      COMPLETENESS_THRESHOLD: ${{ inputs.completeness_threshold || '0.80' }}
      ACCURACY_THRESHOLD: ${{ inputs.accuracy_threshold || '0.95' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start RAG backend
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VECTOR_BACKEND: supabase
          # Match prod (reranker disabled on Render free tier). Flip to true
          # once you upgrade the tier — the eval will then reflect prod truth.
          RERANKER_ENABLED: 'false'
          # Eval should measure cold pipeline behavior, not warm-cache hits.
          CACHE_BACKEND: memory
          RAG_CHAT_MODEL: gemini-2.5-flash
          EVAL_JUDGE_MODEL: gemini-2.5-flash
        run: |
          nohup uvicorn backend_api:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for /v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start. Logs:"; cat backend.log; exit 1

      - name: Run evaluation
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAG_SERVICE_URL: http://127.0.0.1:8000
          EVAL_JUDGE_MODEL: gemini-2.5-flash
        run: python eval/evaluate.py

      - name: Enforce quality thresholds
        id: gate
        run: |
          python - <<'PY'
          import glob, json, os, sys
          reports = sorted(glob.glob('eval/eval_report_*.json'))
          if not reports:
              print('::error::No eval report produced.'); sys.exit(1)
          with open(reports[-1]) as f:
              report = json.load(f)
          summary = report.get('summary', {})
          rel = float(summary.get('avg_relevance', 0))
          comp = float(summary.get('avg_completeness', 0))
          acc = float(summary.get('avg_accuracy', 0))
          lat = float(summary.get('avg_latency_ms', 0))

          rel_t = float(os.environ['RELEVANCE_THRESHOLD'])
          comp_t = float(os.environ['COMPLETENESS_THRESHOLD'])
          acc_t = float(os.environ['ACCURACY_THRESHOLD'])

          # Emit a job summary visible in the Actions tab.
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('## RAG Eval — latest run\n\n')
              s.write('| Metric | Value | Threshold |\n|---|---|---|\n')
              s.write(f'| Avg relevance | {rel:.3f} | ≥ {rel_t} |\n')
              s.write(f'| Avg completeness | {comp:.3f} | ≥ {comp_t} |\n')
              s.write(f'| Avg accuracy | {acc:.3f} | ≥ {acc_t} |\n')
              s.write(f'| Avg latency (ms) | {lat:.0f} | — |\n')

          failed = []
          if rel < rel_t: failed.append(f'relevance {rel:.3f} < {rel_t}')
          if comp < comp_t: failed.append(f'completeness {comp:.3f} < {comp_t}')
          if acc < acc_t: failed.append(f'accuracy {acc:.3f} < {acc_t}')
          if failed:
              print('::error::Thresholds breached: ' + '; '.join(failed))
              sys.exit(1)
          print('All thresholds met.')
          PY

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report-${{ github.run_id }}
          path: eval/eval_report_*.json
          retention-days: 90

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rag-backend-log-${{ github.run_id }}
          path: backend.log
          retention-days: 7

      - name: Open issue on regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[rag-eval] Nightly regression — ${today}`,
              body: [
                `Nightly RAG eval failed on ${today}.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Download the \`rag-eval-report-${context.runId}\` artifact for the full per-question breakdown.`,
              ].join('\n'),
              labels: ['rag-eval', 'regression'],
            });

      - name: Stop backend
        if: always()
        run: |
          if [[ -f backend.pid ]]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
