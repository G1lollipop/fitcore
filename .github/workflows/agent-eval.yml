# Agent Step-1 tool-selection regression gate.
#
# Runs the offline golden-set eval (50 cases, 4 intent modes) against Gemini
# and fails if tool-selection accuracy / k-hit / false-tool-call rate breach
# agent-baseline.json floors.
#
# Triggers: nightly + manual + PRs touching agent / eval code.
#
# Required repo secret: GOOGLE_AI_STUDIO_API_KEY
name: Agent Tool-Selection Eval Gate

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/lib/ai/**'
      - 'web/package.json'
      - '.github/workflows/agent-eval.yml'

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-gate:
    name: Agent tool-selection gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run agent eval + gate
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: npm run eval:agent -- --gate --tag ci

      - name: Upload agent eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-${{ github.run_id }}
          path: web/lib/ai/eval/agent_eval_report_*.json
          retention-days: 90

      - name: Open issue on nightly regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[agent-eval] Nightly tool-selection regression — ${today}`,
              body: [
                `The nightly agent tool-selection eval gate failed on ${today}.`,
                ``,
                `Metrics dropped below web/lib/ai/eval/agent-baseline.json.`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['rag-eval', 'regression'],
            });
