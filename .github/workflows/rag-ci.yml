# Per-PR backend gate: ruff lint/format + pytest. Cheap (no external APIs), so
# it runs on every PR/push that touches rag/.
#
# Lives at the REPO ROOT because GitHub Actions only runs workflows from
# .github/workflows/ at the root (not from subdirectories like rag/.github/).
# All steps run inside rag/ via defaults.run.working-directory.
name: RAG CI

on:
  pull_request:
    branches: [main]
    paths: ['rag/**', '.github/workflows/rag-ci.yml']
  push:
    branches: [main]
    paths: ['rag/**', '.github/workflows/rag-ci.yml']

concurrency:
  group: rag-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            rag/requirements-prod.txt
            rag/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        env:
          # Unit tests must not hit external APIs; these are dummy values so
          # settings/imports resolve without real secrets.
          GOOGLE_AI_STUDIO_API_KEY: ci-dummy
          SUPABASE_URL: https://ci-dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy
          VECTOR_BACKEND: chroma
          RERANKER_ENABLED: 'false'
          CACHE_BACKEND: memory
        run: pytest -q
