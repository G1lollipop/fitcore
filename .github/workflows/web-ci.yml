# Per-PR frontend gate: ESLint + tsc typecheck + production build. No secrets
# required (build runs with dummy env; routes are server-rendered on demand and
# don't hit external services at build time).
#
# Lives at the REPO ROOT because GitHub Actions only runs workflows from
# .github/workflows/ at the root. All steps run inside web/ via
# defaults.run.working-directory.
name: Web CI

on:
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Dummy values so module imports resolve without real secrets. The app
          # is server-rendered on demand, so no external calls happen at build.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy
          RAG_SERVICE_URL: http://127.0.0.1:8000
          GOOGLE_AI_STUDIO_API_KEY: ci-dummy
        run: npm run build
