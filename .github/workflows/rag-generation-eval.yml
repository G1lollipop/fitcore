# Generation-layer eval: faithfulness (RAGAS-style) + abstention on /v1/chat.
# Complements retrieval gate (rag-retrieval-eval.yml) and agent gate (agent-eval.yml).
#
# Nightly + manual only — each run consumes Gemini quota for chat + judging.
name: RAG Generation Eval (faithfulness + abstention)

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      retrieval_min_score:
        description: 'RETRIEVAL_MIN_SCORE for abstention threshold (0=disabled)'
        default: '0.35'

concurrency:
  group: rag-generation-eval
  cancel-in-progress: false

jobs:
  generation-eval:
    name: Faithfulness + abstention
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: rag

    env:
      RETRIEVAL_MIN_SCORE: ${{ inputs.retrieval_min_score || '0.35' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: rag/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start RAG backend
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VECTOR_BACKEND: supabase
          RETRIEVAL_VECTOR_WEIGHT: '0.8'
          RERANKER_ENABLED: 'false'
          CACHE_BACKEND: memory
          RAG_CHAT_MODEL: gemini-2.5-flash
          EVAL_JUDGE_MODEL: gemini-2.5-flash
        run: |
          nohup uvicorn backend_api:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for /v1/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start."; cat backend.log; exit 1

      - name: Run faithfulness eval + gate
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAG_SERVICE_URL: http://127.0.0.1:8000
          EVAL_JUDGE_MODEL: gemini-2.5-flash
        run: python eval/eval_faithfulness.py --http --gate --tag nightly

      - name: Run abstention eval + gate
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAG_SERVICE_URL: http://127.0.0.1:8000
        run: python eval/eval_abstention.py --http --gate --tag nightly

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-generation-reports-${{ github.run_id }}
          path: |
            rag/eval/faithfulness_report_*.json
            rag/eval/abstention_report_*.json
          retention-days: 90

      - name: Open issue on regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[rag-generation] Nightly faithfulness/abstention regression — ${today}`,
              body: [
                `Nightly generation-layer eval failed on ${today}.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['rag-eval', 'regression'],
            });

      - name: Stop backend
        if: always()
        run: |
          if [[ -f backend.pid ]]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
