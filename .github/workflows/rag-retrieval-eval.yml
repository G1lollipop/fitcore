# Retrieval-layer regression gate.
#
# Runs the offline retrieval eval (Recall/nDCG/MRR + abstention) against the
# already-populated Supabase pgvector store and fails if metrics drop below the
# floors in rag/eval/retrieval_baseline.json.
#
# Why read Supabase instead of re-ingesting in CI:
#   - Re-ingesting embeds the whole KB (hundreds of chunks) → blows the Gemini
#     free-tier embedding quota (100/min) and makes the gate flaky.
#   - Reading the live store only embeds the ~21 eval queries. It also measures
#     the SAME corpus prod serves. Ingest is a separate manual step
#     ("RAG KB ingest (Supabase)") run when data/ changes.
#
# Triggers: nightly + manual + PRs that touch retrieval code / data / eval.
#
# Required repo secrets:
#   GOOGLE_AI_STUDIO_API_KEY · SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY
name: RAG Retrieval Eval Gate

on:
  schedule:
    # 03:30 UTC daily (offset from other nightly jobs).
    - cron: '30 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'rag/eval/**'
      - 'rag/data/**'
      - 'rag/app/services/retrieval/**'
      - 'rag/app/services/rag_service.py'
      - 'rag/app/core/settings.py'
      - '.github/workflows/rag-retrieval-eval.yml'

concurrency:
  group: rag-retrieval-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-gate:
    name: Retrieval regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: rag

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: rag/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run retrieval eval + gate (English dataset, prod weight)
        env:
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VECTOR_BACKEND: supabase
          # Mirror prod: vector-dominant hybrid; reranker off; cold (no cache).
          RETRIEVAL_VECTOR_WEIGHT: '0.8'
          RERANKER_ENABLED: 'false'
          CACHE_BACKEND: memory
        run: |
          python eval/eval_retrieval.py \
            --dataset golden_dataset_en.json \
            --variant ensemble \
            --gate \
            --tag ci

      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-report-${{ github.run_id }}
          path: rag/eval/retrieval_report_*.json
          retention-days: 90

      - name: Open issue on nightly regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[rag-retrieval] Nightly retrieval regression — ${today}`,
              body: [
                `The nightly retrieval eval gate failed on ${today}.`,
                ``,
                `Metrics dropped below rag/eval/retrieval_baseline.json.`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Download the \`rag-retrieval-report-${context.runId}\` artifact for the per-query breakdown.`,
              ].join('\n'),
              labels: ['rag-eval', 'regression'],
            });
